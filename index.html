<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Adventure Deck</title>
  <meta name="description" content="A challenge card game for walking around Copenhagen with friends.">
  <meta name="theme-color" content="#16324f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Adventure Deck">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main id="view"><p class="muted center" style="padding-top:40vh">Shuffling the deck…</p></main>
  <nav class="tabs">
    <button data-tab="play" class="on"><span>🃏</span>Play</button>
    <button data-tab="cards"><span>📚</span>Cards</button>
    <button data-tab="records"><span>🏆</span>Records</button>
    <button data-tab="tools"><span>🧰</span>Tools</button>
    <button data-tab="settings"><span>⚙️</span>Settings</button>
  </nav>
  <div id="sheet"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>This app needs JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
