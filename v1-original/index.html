<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copenhagen Adventure Deck</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Copenhagen Adventure Deck</h1>
    <div id="card">
      <p id="mission">Press “Draw a Card” to start!</p>
    </div>
    <div class="buttons">
      <button id="draw">Draw a Card</button>
      <button id="complete">Mark Complete ✅</button>
      <button id="shuffle">Shuffle Deck 🔄</button>
    </div>
    <div id="log">
      <h2>Completed Missions</h2>
      <ul id="completed-list"></ul>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
