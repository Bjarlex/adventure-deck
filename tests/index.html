<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deck tests</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 16px; }
  .pass { color: #2e8b57; } .fail { color: #c8473b; font-weight: 700; }
  #summary { font-size: 18px; font-weight: 700; margin-bottom: 12px; }
</style>
</head>
<body>
<div id="summary">Running…</div>
<ol id="out"></ol>
<script type="module">
import { DEFAULT_CARDS } from '../js/data/cards.js';
import { PLACES, placeById } from '../js/data/places.js';
import { PENANCES } from '../js/data/lists.js';
import * as R from '../js/rules.js';
import worker from '../worker/worker.js';

const results = [];
function test(name, fn) { try { fn(); results.push([name, true]); } catch (e) { results.push([name, false, e.message]); } }
async function atest(name, fn) { try { await fn(); results.push([name, true]); } catch (e) { results.push([name, false, e.message]); } }
function eq(a, b, msg = '') { if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error(`${msg} expected ${JSON.stringify(b)}, got ${JSON.stringify(a)}`); }
function ok(v, msg) { if (!v) throw new Error(msg || 'not ok'); }
const seq = (...xs) => { let i = 0; return () => xs[i++ % xs.length]; };

const cards = DEFAULT_CARDS.map((c) => R.normalizeCard(c));
const P = (id) => ({ id, name: id, emoji: '🙂' });
const game = (extra = {}) => ({ players: [P('a'), P('b'), P('c')], log: [], used: [], filter: {}, rules: { freeVetoes: 1, penanceChance: 0.4, mult: 1 }, range: 1000, ...extra });

// ── Deck data ──
test('card ids are unique', () => eq(new Set(DEFAULT_CARDS.map((c) => c.id)).size, DEFAULT_CARDS.length));
test('every card is valid after normalising', () => {
  for (const c of DEFAULT_CARDS) {
    ok(R.DIFF[c.diff], `${c.id} diff`); ok(R.WHO[c.who], `${c.id} who`);
    for (const t of c.tags) ok(R.TAGS[t], `${c.id} unknown tag ${t}`);
    if (c.tool) ok(R.TOOLS[c.tool], `${c.id} unknown tool ${c.tool}`);
    if (c.tool === 'timer') ok(c.secs > 0, `${c.id} timer without secs`);
    if (c.place) ok(placeById[c.place], `${c.id} unknown place ${c.place}`);
  }
});
test('place ids are unique and inside Copenhagen', () => {
  eq(new Set(PLACES.map((p) => p.id)).size, PLACES.length);
  for (const p of PLACES) ok(p.lat > 55.6 && p.lat < 55.75 && p.lng > 12.45 && p.lng < 12.7, p.id);
});
test('every mode has at least 15 cards (crew mode excepted)', () => {
  for (const m of R.MODES) {
    if (m.filter.customOnly) continue;
    const n = cards.filter((c) => !c.place && R.matchesFilter(c, m.filter)).length;
    ok(n >= 15, `${m.id} has only ${n}`);
  }
});

test('every card condition is known, and every spot is used by a card', () => {
  for (const c of DEFAULT_CARDS) for (const n of c.needs || []) ok(R.NEEDS[n], `${c.id} unknown need ${n}`);
  const used = new Set(DEFAULT_CARDS.map((c) => c.place).filter(Boolean));
  const unused = PLACES.filter((p) => !used.has(p.id) && p.id !== 'noerreport').map((p) => p.id);
  eq(unused, [], 'spots without a card');
});
test('your areas now have location cards nearby', () => {
  const located = cards.filter((c) => c.place);
  const near = ([lat, lng]) => located.filter((c) => R.distanceM({ lat, lng }, R.resolvePlace(c)) <= 1000).length;
  for (const [hood, ll] of Object.entries({ Nørrebro: [55.6925, 12.5560], Vesterbro: [55.6703, 12.5560], Frederiksberg: [55.6786, 12.5321], 'Islands Brygge': [55.6640, 12.5780], Sydhavn: [55.6480, 12.5420] })) {
    ok(near(ll) >= 4, `${hood} has only ${near(ll)}`);
  }
});

// ── Confirming results in live games ──
const claimGame = (n, confirm, votes = {}, extra = {}) => ({
  live: { code: 'ABCD', version: 1 }, rules: { confirm }, turn: 0,
  players: [P('turn'), ...Array.from({ length: n }, (_, i) => P('v' + i)), { id: 'guest_1', name: 'G', guest: true }],
  current: { cardId: 'g001', claim: { type: 'done', by: null, at: 0, votes } }, ...extra,
});
test('voters are everyone except the player on turn and guests', () => {
  eq(R.claimVoters(claimGame(2, 'majority')), ['v0', 'v1']);
});
test('confirmation only applies to live games with other players', () => {
  ok(R.needsConfirmation(claimGame(1, 'majority')));
  ok(!R.needsConfirmation(claimGame(1, 'off')), 'off');
  ok(!R.needsConfirmation({ ...claimGame(1, 'majority'), live: null }), 'local game');
  ok(!R.needsConfirmation(claimGame(0, 'majority')), 'only guests besides you');
  ok(!R.needsConfirmation({ ...claimGame(1, undefined) }), 'older games without the setting');
});
test('majority of the others decides', () => {
  const o = (n, votes) => R.claimOutcome(claimGame(n, 'majority', votes));
  eq([o(1, { v0: 'yes' }), o(1, { v0: 'no' }), o(1, {})], ['accepted', 'disputed', 'pending']);
  eq([o(2, { v0: 'yes' }), o(2, { v0: 'yes', v1: 'yes' }), o(2, { v0: 'no' })], ['pending', 'accepted', 'disputed']);
  eq([o(3, { v0: 'yes', v1: 'yes' }), o(3, { v0: 'yes', v1: 'no' }), o(3, { v0: 'no', v1: 'no' })], ['accepted', 'pending', 'disputed']);
  eq([o(4, { v0: 'yes', v1: 'yes' }), o(4, { v0: 'yes', v1: 'yes', v2: 'yes' }), o(4, { v0: 'no', v1: 'no' })], ['pending', 'accepted', 'disputed']);
});
test('"everyone else" needs every vote, one no sends it back', () => {
  const o = (votes) => R.claimOutcome(claimGame(3, 'all', votes));
  eq([o({ v0: 'yes', v1: 'yes' }), o({ v0: 'yes', v1: 'yes', v2: 'yes' }), o({ v0: 'yes', v1: 'yes', v2: 'no' })], ['pending', 'accepted', 'disputed']);
});
test('the player on turn and guests cannot vote themselves through', () => {
  eq(R.claimOutcome(claimGame(1, 'majority', { turn: 'yes', guest_1: 'yes' })), 'pending');
});
test('a stuck claim can be accepted after 2 minutes, only with yes votes', () => {
  const g = (votes) => claimGame(3, 'all', votes);
  ok(!R.claimCanBeForced(g({ v0: 'yes' }), R.CLAIM_TIMEOUT - 1), 'too early');
  ok(R.claimCanBeForced(g({ v0: 'yes' }), R.CLAIM_TIMEOUT + 1));
  ok(!R.claimCanBeForced(g({}), R.CLAIM_TIMEOUT + 1), 'no votes at all');
  ok(!R.claimCanBeForced(g({ v0: 'yes', v1: 'no' }), R.CLAIM_TIMEOUT + 1), 'someone said no');
});

// ── Season, light and weather ──
const cphDate = (iso) => new Date(iso);
test('sunrise and sunset for Copenhagen are right within ~10 minutes', () => {
  const mins = (d) => d.getUTCHours() * 60 + d.getUTCMinutes();
  const nov = R.sunTimes(cphDate('2026-11-13T12:00:00Z'));
  ok(Math.abs(mins(nov.rise) - (6 * 60 + 49)) <= 10, `Nov sunrise ${nov.rise.toISOString()}`);  // ~07:49 local
  ok(Math.abs(mins(nov.set) - (15 * 60 + 4)) <= 10, `Nov sunset ${nov.set.toISOString()}`);     // ~16:04 local
  const jun = R.sunTimes(cphDate('2026-06-21T12:00:00Z'));
  ok(Math.abs(mins(jun.rise) - (2 * 60 + 25)) <= 10, `Jun sunrise ${jun.rise.toISOString()}`);  // ~04:25 local
  ok(Math.abs(mins(jun.set) - (19 * 60 + 58)) <= 10, `Jun sunset ${jun.set.toISOString()}`);    // ~21:58 local
});
test('conditions follow the calendar, the sun and the weather', () => {
  const winterNight = R.currentConditions(cphDate('2026-12-03T20:00:00Z'), null);
  eq([winterNight.winter, winterNight.xmas, winterNight.summer, winterNight.dark, winterNight.raining], [true, true, false, true, null]);
  const summerDay = R.currentConditions(cphDate('2026-07-10T10:00:00Z'), { isDay: true, raining: false, temp: 22 });
  eq([summerDay.summer, summerDay.winter, summerDay.daylight, summerDay.raining, summerDay.temp], [true, false, true, false, 22]);
  eq(R.currentConditions(cphDate('2026-11-10T10:00:00Z')).xmas, false, 'Christmas starts 15 Nov');
});
test('cards are held back unless they fit', () => {
  const card = (needs) => R.normalizeCard({ id: 'x', title: 'x', text: 'x', needs });
  const rainyNight = { summer: false, winter: true, xmas: false, daylight: false, dark: true, daytime: false, raining: true };
  ok(R.fitsConditions(card([]), rainyNight));
  ok(!R.fitsConditions(card(['dry']), rainyNight));
  ok(R.fitsConditions(card(['rain', 'dark']), rainyNight));
  ok(!R.fitsConditions(card(['summer']), rainyNight));
  ok(R.fitsConditions(card(['dry']), { ...rainyNight, raining: null }), 'unknown weather never blocks');
  ok(!R.fitsConditions(card(['rain']), { ...rainyNight, raining: null }), 'rain cards need known rain');
  ok(R.fitsConditions(card(['summer']), null), 'matching switched off');
  eq(card(['nonsense', 'dark']).needs, ['dark']);
});
test('a rainy winter night deals no summer or daylight cards, but rain and dark ones', () => {
  const rainyNight = { summer: false, winter: true, xmas: true, daylight: false, dark: true, daytime: false, raining: true };
  const pool = R.eligibleCards(cards, game(), null, rainyNight);
  ok(!pool.some((c) => c.needs.includes('summer') || c.needs.includes('daylight') || c.needs.includes('dry')));
  ok(pool.some((c) => c.id === 'g139') && pool.some((c) => c.id === 'g131') && pool.some((c) => c.id === 'g123'), 'rain, Christmas and dark cards available');
  const sunnySummer = { summer: true, winter: false, xmas: false, daylight: true, dark: false, daytime: true, raining: false };
  const pool2 = R.eligibleCards(cards, game(), null, sunnySummer);
  ok(!pool2.some((c) => ['g139', 'g131', 'g123'].includes(c.id)), 'no rain, Christmas or dark cards on a summer day');
  ok(pool2.length > 110, `summer pool ${pool2.length}`); // general cards only: no GPS here
});
test('indoor cards are twice as likely when it rains', () => {
  const g = game({ filter: {} });
  const rainy = { summer: false, winter: true, xmas: false, daylight: true, dark: false, daytime: true, raining: true };
  const pool = R.eligibleCards(cards, g, null, rainy);
  const share = pool.filter((c) => c.tags.includes('indoor')).length / pool.length;
  let indoor = 0; let seed = 1; const rng = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  for (let i = 0; i < 4000; i++) if (R.drawCard(cards, g, null, rng, rainy).card.tags.includes('indoor')) indoor++;
  const drawn = indoor / 4000;
  ok(drawn > share * 1.6 && drawn < share * 2.4, `indoor share ${share.toFixed(2)}, drawn ${drawn.toFixed(2)}`);
});

// ── Geography ──
test('Nyhavn to Rådhuspladsen is roughly 1.4 km', () => {
  const d = R.distanceM(placeById.nyhavn, placeById.radhuspladsen);
  ok(d > 1200 && d < 1600, `got ${d}`);
});
test('bearing from Rådhuspladsen to Nyhavn is east-ish', () => {
  eq(R.compassLabel(R.bearingDeg(placeById.radhuspladsen, placeById.nyhavn)), 'E');
});

// ── Scoring ──
test('points by difficulty, multiplier and spot bonus', () => {
  eq(R.cardPoints({ diff: 1 }), 10);
  eq(R.cardPoints({ diff: 3 }, { mult: 1.5 }), 53);
  eq(R.cardPoints({ diff: 2, place: 'nyhavn' }), 30);
});
test('completion with style bonus and check-in', () => {
  eq(R.completionPoints({ diff: 2, place: 'nyhavn' }, {}, { bonus: true, checkin: true }), 30 + 8 + 5);
});
test('first rejection uses the free veto', () => {
  eq(R.rejectCost({ diff: 2 }, { freeVetoes: 1 }, R.blankStats()), { cost: 0, free: true });
});
test('paid rejections cost half, escalating by 5', () => {
  const s = { ...R.blankStats(), freeUsed: 1, paidRejects: 0 };
  eq(R.rejectCost({ diff: 3 }, { freeVetoes: 1 }, s), { cost: 18, free: false });
  eq(R.rejectCost({ diff: 3 }, { freeVetoes: 1 }, { ...s, paidRejects: 2 }), { cost: 28, free: false });
});
test('penance reduces the loss but never to a gain', () => {
  eq(R.costAfterPenance(18, 1), 9);
  eq(R.costAfterPenance(18, 2), 5);
  eq(R.costAfterPenance(0, 2), 0);
});
test('penance offer follows the mode chance', () => {
  eq(R.rollPenance({ penanceChance: 0 }, PENANCES, () => 0), null);
  ok(R.rollPenance({ penanceChance: 1 }, PENANCES, () => 0.99));
  eq(R.rollPenance({ penanceChance: 0.4 }, PENANCES, () => 0.5), null);
});
test('stats are derived from the log', () => {
  const g = game({ log: [
    { pid: 'a', type: 'done', awards: { a: 20, b: 20 }, place: true },
    { pid: 'b', type: 'reject', awards: {}, free: true },
    { pid: 'c', type: 'reject', awards: { c: -9 }, free: false, penance: { level: 1 } },
    { pid: 'a', type: 'fail', awards: {} },
    { pid: 'b', type: 'done', awards: { b: 13 }, bonus: true },
  ] });
  const s = R.playerStats(g);
  eq([s.a.score, s.a.done, s.a.failed, s.a.places], [20, 1, 1, 1]);
  eq([s.b.score, s.b.done, s.b.freeUsed, s.b.bonuses], [33, 2, 1, 1]);
  eq([s.c.score, s.c.paidRejects, s.c.penances, s.c.rejected], [-9, 1, 1, 1]);
});
test('rounds and time limits end the game', () => {
  eq(R.isOver(game({ rules: { rounds: 2 }, log: new Array(5).fill({}) })), false);
  eq(R.isOver(game({ rules: { rounds: 2 }, log: new Array(6).fill({}) })), 'rounds');
  eq(R.isOver(game({ rules: { minutes: 60 }, startedAt: 0 }), 3600001), 'time');
});
test('ties give multiple winners', () => eq(R.winnersOf([{ id: 'a', score: 5 }, { id: 'b', score: 5 }, { id: 'c', score: 1 }]), ['a', 'b']));

// ── Dealing ──
test('location cards only within range', () => {
  const here = placeById.nyhavn;
  const e = R.eligibleCards(cards, game(), here);
  ok(e.some((c) => c.id === 'p001'), 'Nyhavn card missing at Nyhavn');
  ok(!e.some((c) => c.id === 'p039'), 'CopenHill (2 km away) should not be eligible');
  ok(!R.eligibleCards(cards, game(), null).some((c) => c.place), 'no location cards without GPS');
  for (const c of e.filter((c) => c.place)) ok(R.distanceM(here, R.resolvePlace(c)) <= 1000, c.id);
});
test('completed cards never come back; reshuffle after the pool runs dry', () => {
  const g = game({ filter: { anyTags: ['transit'] } });
  const pool = R.eligibleCards(cards, g, null);
  g.log = [{ type: 'done', cardId: pool[0].id, pid: 'a', awards: {} }];
  g.used = pool.map((c) => c.id);
  const r = R.drawCard(cards, g, null);
  ok(r.reshuffled, 'should reshuffle');
  ok(r.card.id !== pool[0].id, 'completed card came back');
});
test('a single player never gets duo or versus cards', () => {
  const e = R.eligibleCards(cards, game({ players: [P('a')] }), null);
  ok(e.length > 30 && e.every((c) => c.who === 'solo' || c.who === 'group'));
});
test('explorer bias picks nearby cards', () => {
  const g = game({ rules: { placeBias: 0.7 } });
  const r = R.drawCard(cards, g, placeById.nyhavn, seq(0.1, 0.0));
  ok(r.card.place, 'expected a location card');
});
test('crew-only mode only deals custom cards', () => {
  const custom = R.normalizeCard({ id: 'c_x', title: 'X', text: 'y', diff: 1, who: 'solo' }, true);
  const e = R.eligibleCards([...cards, custom], game({ filter: { customOnly: true } }), null);
  eq(e.map((c) => c.id), ['c_x']);
});
test('switched-off cards are not active', () => {
  const act = R.activeCards(DEFAULT_CARDS, [], { g001: { id: 'g001', off: true } });
  ok(!act.some((c) => c.id === 'g001'));
  eq(act.length, DEFAULT_CARDS.length - 1);
});

// ── Records ──
test('leaderboard and top scores', () => {
  const games = [
    { id: 'g1', endedAt: 1, modeName: 'Classic', winnerIds: ['a'], players: [{ ...P('a'), score: 50, done: 3 }, { ...P('b'), score: 20, done: 1 }] },
    { id: 'g2', endedAt: 2, modeName: 'Classic', winnerIds: ['b'], players: [{ ...P('a'), score: 10, done: 1 }, { ...P('b'), score: 70, done: 4 }] },
  ];
  const lb = Object.fromEntries(R.leaderboard(games, []).map((r) => [r.id, r]));
  eq([lb.a.points, lb.a.wins, lb.a.best, lb.a.games], [60, 1, 50, 2]);
  eq([lb.b.points, lb.b.wins, lb.b.best], [90, 1, 70]);
  eq(R.topScores(games, 2).map((r) => r.score), [70, 50]);
});

// ── Players ──
test('names match regardless of case and spacing', () => {
  eq(R.nameKey('  Rafael  Bo '), 'rafael bo');
  ok(R.similarNames('rafael', 'Rafael'));
});
test('similar names: nicknames and typos, but not different people', () => {
  ok(R.similarNames('Raf', 'Rafael'), 'prefix');
  ok(R.similarNames('Matt', 'Mat'), 'prefix 3');
  ok(R.similarNames('Bjarke', 'Bjarek'), 'swap');
  ok(R.similarNames('Christoffer', 'Kristoffer'), 'one letter in a long name');
  ok(!R.similarNames('Matt', 'Mads'), 'Matt ≠ Mads');
  ok(!R.similarNames('Bo', 'Bob'), 'too short to guess');
  ok(!R.similarNames('Anna', 'Emma'));
});
test('duplicate groups', () => {
  const g = R.duplicateGroups([{ id: 1, name: 'Rafael' }, { id: 2, name: 'rafael ' }, { id: 3, name: 'Matt' }]);
  eq(g.map((x) => x.map((p) => p.id)), [[1, 2]]);
});
test('guests are recognised and left out of records', () => {
  ok(R.isGuest({ id: 'guest_x' })); ok(R.isGuest({ id: 'p1', guest: true })); ok(!R.isGuest({ id: 'p_1' }));
  const games = [{ id: 'g', endedAt: 1, winnerIds: ['guest_1'], players: [{ id: 'guest_1', name: 'Tourist', score: 99, guest: true }, { id: 'p_a', name: 'A', score: 10 }] }];
  eq(R.leaderboard(games, []).map((r) => r.id), ['p_a']);
  eq(R.topScores(games).map((r) => r.id), ['p_a']);
});
test('deleted players are hidden from the leaderboard and highscores', () => {
  const games = [{ id: 'g', endedAt: 1, winnerIds: ['p_gone'], players: [{ id: 'p_gone', name: 'Old', score: 99 }, { id: 'p_a', name: 'A', score: 10 }] }];
  const hidden = new Set(['p_gone']);
  eq(R.leaderboard(games, [], hidden).map((r) => r.id), ['p_a']);
  eq(R.topScores(games, 10, hidden).map((r) => r.id), ['p_a']);
  eq(R.leaderboard(games, []).length, 2, 'without the hidden set nothing changes');
});
test('merging a duplicate rewrites players, winners, log and awards', () => {
  const game = { id: 'g1', winnerIds: ['p_dup'], players: [{ id: 'p_dup', name: 'Raf', emoji: '🐸', score: 30, done: 2 }, { id: 'p_b', name: 'Bo', emoji: '🐼', score: 10, done: 1 }],
    log: [{ pid: 'p_dup', type: 'done', awards: { p_dup: 20 } }, { pid: 'p_b', type: 'done', awards: { p_b: 10, p_dup: 10 } }] };
  const m = R.mergePlayerInGame(game, 'p_dup', { id: 'p_raf', name: 'Rafael', emoji: '🐻' });
  eq(m.players.map((p) => [p.id, p.name, p.score]), [['p_raf', 'Rafael', 30], ['p_b', 'Bo', 10]]);
  eq(m.winnerIds, ['p_raf']);
  eq(m.log.map((e) => [e.pid, e.awards]), [['p_raf', { p_raf: 20 }], ['p_b', { p_b: 10, p_raf: 10 }]]);
  eq(game.players[0].id, 'p_dup', 'original must be untouched');
  eq(R.mergePlayerInGame(game, 'p_nobody', { id: 'x' }), null);
});
test('merging when both copies played the same game adds them up', () => {
  const game = { id: 'g2', winnerIds: ['p_b'], players: [{ id: 'p_dup', name: 'Raf', score: 15, done: 1 }, { id: 'p_raf', name: 'Rafael', score: 15, done: 1 }, { id: 'p_b', name: 'Bo', score: 20, done: 2 }], log: [] };
  const m = R.mergePlayerInGame(game, 'p_dup', { id: 'p_raf', name: 'Rafael', emoji: '🐻' });
  eq(m.players.map((p) => [p.id, p.score, p.done]), [['p_raf', 30, 2], ['p_b', 20, 2]]);
  eq(m.winnerIds, ['p_raf'], 'combined score overtakes Bo');
});

// ── Worker ──
function mockKV() {
  const m = new Map(); let writes = 0;
  return { get: async (k, t) => (m.has(k) ? (t === 'json' ? JSON.parse(m.get(k)) : m.get(k)) : null), put: async (k, v) => { writes++; m.set(k, v); }, writes: () => writes,
    list: async ({ prefix }) => ({ keys: [...m.keys()].filter((k) => k.startsWith(prefix)).map((name) => ({ name })) }), delete: async (k) => { m.delete(k); }, raw: m };
}
const env = () => ({ DECK: mockKV(), CREW_KEY: 'secret-key', ALLOWED_ORIGIN: 'https://friend.github.io' });
// Browsers forbid setting the Origin header on a real Request, so use a request-shaped object
// (standalone Headers allow it). The Worker only uses method, url, headers and text().
const fakeReq = (url, { method = 'GET', headers = {}, body } = {}) => ({ method, url, headers: new Headers(headers), text: async () => body ?? '' });
const call = (e, body, { key = 'secret-key', origin = 'https://friend.github.io', method = 'POST' } = {}) =>
  worker.fetch(fakeReq('https://deck.example.workers.dev/api/sync', { method, headers: { 'content-type': 'application/json', 'x-crew-key': key, origin }, body: method === 'POST' ? JSON.stringify(body) : undefined }), e);

await atest('worker rejects a wrong key', async () => { const r = await call(env(), {}, { key: 'nope' }); eq(r.status, 401); });
await atest('worker rejects another origin', async () => { const r = await call(env(), {}, { origin: 'https://evil.example' }); eq(r.status, 403); });
await atest('worker answers CORS preflight', async () => {
  const r = await worker.fetch(fakeReq('https://x/api/sync', { method: 'OPTIONS', headers: { origin: 'https://friend.github.io' } }), env());
  eq(r.status, 204); eq(r.headers.get('access-control-allow-origin'), 'https://friend.github.io');
});
await atest('worker explains missing config', async () => { const r = await call({ CREW_KEY: 'k' }, {}, { key: 'k' }); eq(r.status, 500); ok((await r.json()).error.includes('DECK')); });
await atest('worker merges: newest wins, older ignored, writes only on change', async () => {
  const e = env();
  let r = await call(e, { players: [{ id: 'p_1', name: 'Ann', updatedAt: 100 }] });
  eq(r.status, 200);
  r = await call(e, { players: [{ id: 'p_1', name: 'Old Ann', updatedAt: 50 }, { id: 'p_2', name: 'Bo', updatedAt: 60 }] });

  r = await call(e, { players: [{ id: 'p_1', name: 'Anna', updatedAt: 200 }] });

// ── Worker: live games (D1) ──
function mockD1() {
  const rows = new Map();
  const prepare = (sql) => {
    const s = sql.trim(); let args = [];
    const api = {
      bind: (...a) => { args = a; return api; },
      async run() {
        if (s.startsWith('CREATE TABLE')) return { meta: { changes: 0 } };
        if (s.startsWith('ALTER TABLE')) throw new Error('duplicate column name: crew');
        if (s.startsWith('DELETE FROM live_games WHERE updated_at')) { let n = 0; for (const [k, r] of rows) if (r.updated_at < args[0]) { rows.delete(k); n++; } return { meta: { changes: n } }; }
        if (s.startsWith('INSERT OR IGNORE')) { const [code, state, now, crew] = args; if (rows.has(code)) return { meta: { changes: 0 } }; rows.set(code, { version: 1, state, updated_at: now, crew }); return { meta: { changes: 1 } }; }
        if (s.startsWith('UPDATE live_games')) { const [state, now, code, base, crew] = args; const r = rows.get(code); if (!r || r.version !== base || r.crew !== crew) return { meta: { changes: 0 } }; Object.assign(r, { state, version: r.version + 1, updated_at: now }); return { meta: { changes: 1 } }; }
        if (s.startsWith('DELETE FROM live_games WHERE crew')) { for (const [k, r] of rows) if (r.crew === args[0]) rows.delete(k); return { meta: { changes: 1 } }; }
        if (s.startsWith('DELETE FROM live_games WHERE code')) { const r = rows.get(args[0]); if (r && r.crew === args[1]) rows.delete(args[0]); return { meta: { changes: 1 } }; }
        throw new Error('unexpected SQL: ' + s);
      },
      async first() { if (s.startsWith('SELECT')) { const r = rows.get(args[0]); return r && r.crew === args[1] ? { ...r } : null; } throw new Error('unexpected SQL: ' + s); },
    };
    return api;
  };
  return { prepare, rows };
}
const liveEnv = () => ({ ...env(), GAMES: mockD1() });
const liveCall = (e, method, path, body) => worker.fetch(fakeReq('https://deck.example.workers.dev/api/live' + path,
  { method, headers: { 'content-type': 'application/json', 'x-crew-key': 'secret-key', origin: 'https://friend.github.io' }, body: body ? JSON.stringify(body) : undefined }), e);

await atest('live: explains a missing GAMES binding', async () => {
  const r = await liveCall(env(), 'POST', '', { state: { a: 1 } });
  eq(r.status, 500); ok((await r.json()).error.includes('GAMES'));
});
await atest('live: needs the crew key', async () => {
  const r = await worker.fetch(fakeReq('https://x/api/live/ABCD', { headers: { 'x-crew-key': 'nope' } }), liveEnv());
  eq(r.status, 401);
});
await atest('live: create, read, cheap poll, update, conflict, delete', async () => {
  const e = liveEnv();
  let r = await liveCall(e, 'POST', '', { state: { log: [], turn: 0 } });
  eq(r.status, 201);
  const { code, version } = await r.json();
  ok(/^[A-HJ-NP-Z]{4}$/.test(code), `bad code ${code}`); eq(version, 1);
  r = await liveCall(e, 'GET', `/${code.toLowerCase()}`);
  eq(r.status, 200); eq((await r.json()).state, { log: [], turn: 0 });
  r = await liveCall(e, 'GET', `/${code}?since=1`);
  eq(r.status, 204, 'unchanged poll');
  r = await liveCall(e, 'PUT', `/${code}`, { baseVersion: 1, state: { log: ['phone A'], turn: 1 } });
  eq(r.status, 200); eq((await r.json()).version, 2);
  r = await liveCall(e, 'PUT', `/${code}`, { baseVersion: 1, state: { log: ['phone B'], turn: 1 } });
  eq(r.status, 409, 'stale write must be refused');
  const conflict = await r.json();
  eq([conflict.version, conflict.state.log], [2, ['phone A']]);
  r = await liveCall(e, 'GET', `/${code}?since=1`);
  eq((await r.json()).version, 2);
  r = await liveCall(e, 'DELETE', `/${code}`);
  eq(r.status, 200);
  r = await liveCall(e, 'GET', `/${code}`);
  eq(r.status, 404);
});
await atest('live: rejects bad input', async () => {
  const e = liveEnv();
  eq((await liveCall(e, 'POST', '', { nope: 1 })).status, 400);
  const { code } = await (await liveCall(e, 'POST', '', { state: {} })).json();
  eq((await liveCall(e, 'PUT', `/${code}`, { state: {} })).status, 400, 'missing baseVersion');
  eq((await liveCall(e, 'PUT', `/${code}`, { baseVersion: 1, state: { big: 'x'.repeat(500000) } })).status, 413);
  eq((await liveCall(e, 'GET', '/ZZZZ')).status, 404);
  eq((await liveCall(e, 'GET', '/TOOLONG')).status, 404);
});
await atest('live: old games are cleaned up when a new one starts', async () => {
  const e = liveEnv();
  e.GAMES.rows.set('OLDY', { version: 3, state: '{}', updated_at: Date.now() - 4 * 86400000 });
  await liveCall(e, 'POST', '', { state: {} });
  ok(!e.GAMES.rows.has('OLDY'));
});

// ── Worker: crews ──
const ADMIN = { 'x-crew-key': 'secret-key' };
const req = (e, method, path, body, headers = {}) => worker.fetch(fakeReq('https://deck.example.workers.dev' + path,
  { method, headers: { 'content-type': 'application/json', origin: 'https://friend.github.io', ...headers }, body: body ? JSON.stringify(body) : undefined }), e);
const memberOf = (crew, token) => ({ 'x-crew-id': crew, 'x-member-token': token });

await atest('crews: only the owner can create or list crews', async () => {
  const e = liveEnv();
  eq((await req(e, 'POST', '/api/crews', { name: 'X' })).status, 401, 'no auth');
  eq((await req(e, 'POST', '/api/crews', { name: 'X' }, { 'x-crew-key': 'wrong' })).status, 401, 'wrong key');
  const r = await req(e, 'POST', '/api/crews', { name: 'Nørrebro gang' }, ADMIN);
  eq(r.status, 201);
  const c = await r.json();
  ok(/^[A-Z2-9]{8}$/.test(c.id), `id ${c.id}`); ok(c.invite.startsWith(c.id + '-') && c.invite.length === 29, `invite ${c.invite}`);
  const { token } = await (await req(e, 'POST', '/api/join', { invite: c.invite })).json();
  eq((await req(e, 'POST', '/api/crews', { name: 'Y' }, memberOf(c.id, token))).status, 401, 'members cannot create crews');
  const list = await (await req(e, 'GET', '/api/crews', null, ADMIN)).json();
  eq(list.map((x) => x.name), ['Main crew', 'Nørrebro gang']);
  eq(list[1].members, 1);
});
await atest('crews: secrets are only stored hashed', async () => {
  const e = liveEnv();
  const c = await (await req(e, 'POST', '/api/crews', { name: 'A' }, ADMIN)).json();
  const { token } = await (await req(e, 'POST', '/api/join', { invite: c.invite })).json();
  const stored = e.DECK.raw.get(`crew:meta:${c.id}`);
  ok(!stored.includes(c.invite.split('-')[1]) && !stored.includes(token), 'plain secret found in storage');
});
await atest('crews: joining needs a valid invite (any case)', async () => {
  const e = liveEnv();
  const c = await (await req(e, 'POST', '/api/crews', { name: 'A' }, ADMIN)).json();
  eq((await req(e, 'POST', '/api/join', { invite: 'nonsense' })).status, 400);
  eq((await req(e, 'POST', '/api/join', { invite: c.id + '-' + 'A'.repeat(20) })).status, 401);
  const r = await req(e, 'POST', '/api/join', { invite: c.invite.toLowerCase() });
  eq(r.status, 200);
  eq((await r.json()).crew.name, 'A');
});
await atest('crews: records are separate per crew', async () => {
  const e = liveEnv();
  const c = await (await req(e, 'POST', '/api/crews', { name: 'A' }, ADMIN)).json();
  const { token } = await (await req(e, 'POST', '/api/join', { invite: c.invite })).json();
  await req(e, 'POST', '/api/sync', { players: [{ id: 'p_main', name: 'Main person', updatedAt: 1 }] }, ADMIN);
  await req(e, 'POST', '/api/sync', { players: [{ id: 'p_a', name: 'Crew A person', updatedAt: 1 }] }, memberOf(c.id, token));
  const main = await (await req(e, 'POST', '/api/sync', {}, ADMIN)).json();
  const a = await (await req(e, 'POST', '/api/sync', {}, memberOf(c.id, token))).json();
  eq(main.players.map((p) => p.id), ['p_main']);
  eq(a.players.map((p) => p.id), ['p_a']);
  const adminInA = await (await req(e, 'POST', '/api/sync', {}, { ...ADMIN, 'x-crew-id': c.id })).json();
  eq(adminInA.players.map((p) => p.id), ['p_a'], 'owner can open any crew');

await atest('crews: a member pass only works for its own crew', async () => {
  const e = liveEnv();
  const a = await (await req(e, 'POST', '/api/crews', { name: 'A' }, ADMIN)).json();
  const b = await (await req(e, 'POST', '/api/crews', { name: 'B' }, ADMIN)).json();
  const { token } = await (await req(e, 'POST', '/api/join', { invite: a.invite })).json();
  eq((await req(e, 'POST', '/api/sync', {}, memberOf(b.id, token))).status, 401);
  eq((await req(e, 'POST', '/api/sync', {}, memberOf('main', token))).status, 401);
  eq((await req(e, 'POST', '/api/sync', {}, memberOf(a.id, 'X'.repeat(32)))).status, 401, 'made-up pass');
});
await atest('crews: a new invite stops the old code but keeps members in', async () => {
  const e = liveEnv();
  const c = await (await req(e, 'POST', '/api/crews', { name: 'A' }, ADMIN)).json();
  const { token } = await (await req(e, 'POST', '/api/join', { invite: c.invite })).json();

  eq((await req(e, 'POST', '/api/join', { invite: fresh.invite })).status, 200, 'new invite');
  eq((await req(e, 'POST', '/api/sync', {}, memberOf(c.id, token))).status, 200, 'existing member still in');

await atest('crews: the original crew can get an invite too', async () => {
  const e = liveEnv();
  await req(e, 'POST', '/api/sync', { players: [{ id: 'p_1', name: 'Old', updatedAt: 1 }] }, ADMIN);
  const inv = await (await req(e, 'POST', '/api/crews/main/invite', { name: 'The originals' }, ADMIN)).json();
  ok(inv.invite.startsWith('main-'));
  const j = await (await req(e, 'POST', '/api/join', { invite: inv.invite })).json();
  eq(j.crew, { id: 'main', name: 'The originals' });
  const doc = await (await req(e, 'POST', '/api/sync', {}, memberOf('main', j.token))).json();

await atest('crews: live games are invisible to other crews', async () => {
  const e = liveEnv();
  const a = await (await req(e, 'POST', '/api/crews', { name: 'A' }, ADMIN)).json();
  const { token } = await (await req(e, 'POST', '/api/join', { invite: a.invite })).json();
  const { code } = await (await req(e, 'POST', '/api/live', { state: { x: 1 } }, memberOf(a.id, token))).json();
  eq((await req(e, 'GET', `/api/live/${code}`, null, memberOf(a.id, token))).status, 200, 'same crew');
  eq((await req(e, 'GET', `/api/live/${code}`, null, ADMIN)).status, 404, 'main crew cannot see it');
  eq((await req(e, 'PUT', `/api/live/${code}`, { baseVersion: 1, state: { hijack: true } }, ADMIN)).status, 404, 'main crew cannot change it');
  const back = await (await req(e, 'GET', `/api/live/${code}`, null, memberOf(a.id, token))).json();
  eq(back.state, { x: 1 });
});

await atest('delete crew: owner only, and never the Main crew', async () => {
  const e = liveEnv();
  const c = await (await req(e, 'POST', '/api/crews', { name: 'Doomed' }, ADMIN)).json();
  const { token } = await (await req(e, 'POST', '/api/join', { invite: c.invite })).json();
  eq((await req(e, 'DELETE', `/api/crews/${c.id}`, null, memberOf(c.id, token))).status, 401, 'members cannot delete');
  eq((await req(e, 'DELETE', `/api/crews/${c.id}`)).status, 401, 'no auth');
  eq((await req(e, 'DELETE', '/api/crews/main', null, ADMIN)).status, 400, 'main is protected');
  eq((await req(e, 'DELETE', '/api/crews/ZZZZZZZZ', null, ADMIN)).status, 404, 'unknown crew');
});
await atest('delete crew: records, live games and invites are gone; members are told', async () => {
  const e = liveEnv();
  const c = await (await req(e, 'POST', '/api/crews', { name: 'Doomed' }, ADMIN)).json();
  const keep = await (await req(e, 'POST', '/api/crews', { name: 'Keeper' }, ADMIN)).json();
  const { token } = await (await req(e, 'POST', '/api/join', { invite: c.invite })).json();
  const k = await (await req(e, 'POST', '/api/join', { invite: keep.invite })).json();
  await req(e, 'POST', '/api/sync', { players: [{ id: 'p_x', name: 'X', updatedAt: 1 }] }, memberOf(c.id, token));
  const { code } = await (await req(e, 'POST', '/api/live', { state: { a: 1 } }, memberOf(c.id, token))).json();
  const { code: keepCode } = await (await req(e, 'POST', '/api/live', { state: { b: 1 } }, memberOf(keep.id, k.token))).json();
  const r = await req(e, 'DELETE', `/api/crews/${c.id}`, null, ADMIN);
  eq(r.status, 200); eq((await r.json()).name, 'Doomed');
  ok(!e.DECK.raw.has(`crew:doc:${c.id}`), 'records erased');
  ok(![...e.GAMES.rows.values()].some((x) => x.crew === c.id), 'live games erased');
  ok(e.GAMES.rows.has(keepCode), 'other crews keep their live games');
  eq((await req(e, 'POST', '/api/sync', {}, memberOf(c.id, token))).status, 410, 'member told it was deleted');
  eq((await req(e, 'GET', `/api/live/${code}`, null, memberOf(c.id, token))).status, 410);
  eq((await req(e, 'POST', '/api/join', { invite: c.invite })).status, 410, 'invite dead');
  eq((await req(e, 'POST', '/api/sync', {}, { ...ADMIN, 'x-crew-id': c.id })).status, 410, 'owner too');
  eq((await req(e, 'DELETE', `/api/crews/${c.id}`, null, ADMIN)).status, 404, 'cannot delete twice');
  eq((await req(e, 'POST', `/api/crews/${c.id}/invite`, {}, ADMIN)).status, 404, 'no new invites');
  eq((await (await req(e, 'GET', '/api/crews', null, ADMIN)).json()).map((x) => x.name), ['Main crew', 'Keeper']);
  eq((await req(e, 'POST', '/api/sync', {}, memberOf(keep.id, k.token))).status, 200, 'other crews unaffected');
});

// ── App: moving settings from earlier versions ──
const { migrateSettings } = await import('../js/store.js');
test('migration: a phone that synced becomes owner of the main crew, data stays put', () => {
